name: PharmaWatch Production CI/CD Pipeline

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Fast lint gate (no services) ───────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Python syntax & lint check
        run: ruff check backend/ scripts/ --select=E9,F63,F7,F82

  # ── Test suite, split into parallel categories (unit / integration / statistics) ──
  # The categories are auto-tagged by file name in backend/tests/conftest.py and together
  # cover the whole suite. Every leg gets the same MySQL service and environment, so the split
  # is purely for parallelism and clearer signal — it never changes any test's outcome.
  test:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, statistics]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pharmawatch_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: pharmawatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.2.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install pytest "pyspark==3.5.3"   # Spark tests use the JVM preinstalled on the runner
      - name: Run MySQL migrations
        run: cd backend && python -m db.migrate
      - name: Run ${{ matrix.suite }} tests
        run: pytest backend/tests/ -m "${{ matrix.suite }}" -v

  # ── Validation smoke run (uploads the report as an artifact) ───────────────
  validation-smoke:
    name: Validation smoke (interaction model)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pharmawatch_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: pharmawatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.2.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install pytest "pyspark==3.5.3"
      - name: Run MySQL migrations
        run: cd backend && python -m db.migrate
      - name: Validation smoke run
        working-directory: backend
        run: python -m validation.run_all --smoke --only ddi
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/validation/
          if-no-files-found: ignore

  # ── Build images. On a pull request: build only (prove the image builds from a clean
  #    checkout with no data folder). On a push to main: build and push to GHCR. ──────
  build-and-push:
    name: Build & Push Docker Images
    needs: [test, validation-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide whether to push
        id: mode
        run: echo "push=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        id: image_name
        run: echo "IMAGE_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build (and push on main) Web Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ steps.mode.outputs.push == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.IMAGE_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.IMAGE_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (and push on main) Kafka Ingestion Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.kafka
          push: ${{ steps.mode.outputs.push == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.IMAGE_LOWER }}-kafka:latest
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.IMAGE_LOWER }}-kafka:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud VM
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        if: env.PROD_SERVER_IP != ''
        env:
          PROD_SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/pharmawatch
            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker/compose.yml --profile core --profile kafka pull
            docker compose -f docker/compose.yml --profile core --profile kafka up -d --remove-orphans
            docker image prune -f
