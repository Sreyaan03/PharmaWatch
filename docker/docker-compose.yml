# ─────────────────────────────────────────────────────────────────────────────
# PharmaWatch — Docker Compose (Full Stack with Real Kafka Pipeline)
#
# Runs the complete stack in one command from the repo root:
#   docker compose -f docker/docker-compose.yml up --build
#
# Services:
#   http://localhost:5000  → PharmaWatch Flask app
#   http://localhost:8080  → Kafka UI (view topics, messages, consumer lag)
#
# To run only the app without Kafka (lighter, for development):
#   docker compose -f docker/docker-compose.yml up pharmawatch
# ─────────────────────────────────────────────────────────────────────────────


# ── Shared network so all containers can talk to each other ──────────────────
networks:
  pharmawatch-net:
    driver: bridge

# ── Persistent volume for SQLite database shared between app and consumer ────
volumes:
  pharmawatch-db:

services:

  # ── 1. ZOOKEEPER (required by Kafka) ───────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    networks: [pharmawatch-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. KAFKA BROKER ────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    networks: [pharmawatch-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"        # accessible from your laptop at localhost:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168          # keep messages 7 days
      KAFKA_MESSAGE_MAX_BYTES: 5242880        # 5 MB max message size
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── 3. KAFKA UI — browser dashboard at http://localhost:8080 ───────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [pharmawatch-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pharmawatch-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: "false"

  # ── 4. KAFKA PRODUCER — polls real data sources into topics ────────────────
  kafka-producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kafka
    container_name: kafka-producer
    networks: [pharmawatch-net]
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
      - KAFKA_ROLE=producer
    command: ["python", "scripts/kafka_producer.py"]
    restart: unless-stopped

  # ── 5. KAFKA CONSUMER — processes topics, writes to SQLite ─────────────────
  kafka-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kafka
    container_name: kafka-consumer
    networks: [pharmawatch-net]
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
      - KAFKA_ROLE=consumer
    volumes:
      - ../backend:/app/backend   # shares SQLite DB with the Flask app
    command: ["python", "scripts/kafka_consumer.py"]
    restart: unless-stopped

  # ── 6. PHARMAWATCH FLASK APP ───────────────────────────────────────────────
  pharmawatch:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pharmawatch
    networks: [pharmawatch-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ../data/pharmawatch_faers.duckdb:/app/data/pharmawatch_faers.duckdb:ro
      - ../data/twosides.parquet:/app/data/twosides.parquet:ro
      - ../data/drugbank_ddi.tsv:/app/data/drugbank_ddi.tsv:ro
      - ../backend/trained_models:/app/backend/trained_models:ro
      - ../backend:/app/backend   # shares SQLite DB with the consumer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
